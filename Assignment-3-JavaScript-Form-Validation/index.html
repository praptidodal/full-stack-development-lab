<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>

        <form id="registerForm">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <span class="error" id="nameError"></span>

            <label for="email">Email</label>
            <input type="text" id="email" placeholder="example@email.com">
            <span class="error" id="emailError"></span>

            <label for="phone">Phone</label>
            <input type="text" id="phone" placeholder="10-digit mobile number">
            <span class="error" id="phoneError"></span>

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="At least 6 characters">
            <span class="error" id="passwordError"></span>

            <button type="submit">Submit Registration</button>
        </form>

        <p id="successMessage"></p>

        <div class="nav-bottom">
            <a href="../index.html" class="nav-link">&larr; Home</a>
            <a href="../Assignment-4-React-Profile-Card/index.html" class="nav-link">Assignment 4 &rarr;</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
