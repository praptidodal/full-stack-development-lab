name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build React assignments
        run: |
          for app in Assignment-4-React-Profile-Card Assignment-5-React-Controlled-Form Assignment-6-React-Counter
          do
            cd $app
            npm ci
            npm run build
            cd ..
          done

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp index.html style.css _site/
          cp -r Assignment-1-JavaScript-Calculator _site/
          cp -r Assignment-2-DOM-ToDo-List _site/
          cp -r Assignment-3-JavaScript-Form-Validation _site/
          mkdir -p _site/Assignment-4-React-Profile-Card
          cp -r Assignment-4-React-Profile-Card/dist/* _site/Assignment-4-React-Profile-Card/
          mkdir -p _site/Assignment-5-React-Controlled-Form
          cp -r Assignment-5-React-Controlled-Form/dist/* _site/Assignment-5-React-Controlled-Form/
          mkdir -p _site/Assignment-6-React-Counter
          cp -r Assignment-6-React-Counter/dist/* _site/Assignment-6-React-Counter/
          touch _site/.nojekyll

      - name: Push to gh-pages branch
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy to gh-pages"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
